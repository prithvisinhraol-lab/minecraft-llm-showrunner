schema_version: 1
actor: hero
relationship: determined owner of the stolen map
voice: direct and steady
vocabulary: plain heroic language
cadence: short confident sentences
humor: dry understatement
emotional_range: [determined, guarded]
scene_attitude: resolute
preferred_subjects: [maps, promises]
forbidden_subjects: [modern internet slang]
max_line_words: 18
positive_examples: [I will take it back.]
rehearsal:
  provider: openai
  model: rehearsal-model
  runtime_use: false
  max_candidates: 3
  max_input_tokens: 400
  max_output_tokens: 80
  timeout_seconds: 10
  max_retries: 1
